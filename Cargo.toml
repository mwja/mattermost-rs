[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/mattermost",
    "crates/gpui-tokio-bridge",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.93.0"

[workspace.dependencies]
# Internal crates
mattermost = { path = "crates/mattermost" }
gpui-tokio-bridge = { path = "crates/gpui-tokio-bridge" }

anyhow = "1.0.104"
clap = "4.6.6"
directories = "6"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "60e1cb7d4733fff8558cd387b4a7fca78bb6005b" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "60e1cb7d4733fff8558cd387b4a7fca78bb6005b" }
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }
log = "0.4.33"
reqwest = { version = "0.13.4", features = ["default", "cookies", "json"] }
rmp-serde = "1.3.1"
serde = "1.0.229"
serde_json = "1.0.151"
simple_logger = "5.2.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }

[workspace.lints.rust]
unsafe_code = "forbid"
